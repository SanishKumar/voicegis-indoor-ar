name: Quality

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

  browser-tests:
    name: Browser checks (${{ matrix.suite }})
    runs-on: ubuntu-latest
    # Each device project gets its own runner and Playwright budget. The
    # growing campus suite must not consume the other project's time or keep
    # the offline checks from running. Every invocation still uses one worker.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: desktop
            command: npm run test:browser:operator -- --project=desktop-chromium
          - suite: mobile
            command: npm run test:browser:operator -- --project=mobile-chromium
          - suite: offline
            command: npm run test:browser:offline

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production browser smoke
        run: ${{ matrix.command }}

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Preserve the existing required-check name. A failed, cancelled or skipped
  # matrix must not produce a green aggregate or permit Pages publication.
  browser-smoke:
    name: Browser smoke
    if: always()
    needs: browser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every browser suite to pass
        env:
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
        run: test "$BROWSER_RESULT" = "success"
